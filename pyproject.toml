[tool.ruff]
exclude = [
    "*_rc.py",
    "*_ui.py",
    "build",
]

[tool.ruff.lint]
# For all rules, see: https://docs.astral.sh/ruff/rules/
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "D",  # pydocstyle
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "S",  # flake8-bandit
]
ignore = ["D107", "D200", "D202", "D203", "D212", "D213", "D406", "D407", "D413", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
